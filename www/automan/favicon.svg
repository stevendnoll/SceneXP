<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="John Walker, The Auto Man">
    <!-- ONE MARK, TWO SIZES. This file is the browser tab icon at 16 pixels
         and the logo on the loading screen at 150, so whatever somebody
         watches while the showroom builds is the same thing that then sits
         in their tab.

         IT IS NOT A CAR. The first placeholder was a little gold sedan,
         which was the wrong idea twice over: a car at 16 pixels is a gold
         smudge with two dots under it, and the one thing a car icon says
         at any size is DEALERSHIP, which is the side of the desk John
         spent twenty five years leaving.

         IT IS A SERIF W, because the page it belongs to is set in a serif
         throughout and a monoline mark argued with every heading under it.
         What says "serif" at 16 pixels is not the serifs, which are barely
         half a pixel tall: it is STROKE CONTRAST. The down-strokes are 8
         units against the up-strokes' 4.2, which is an old-style ratio a
         text face would recognise and which a stroked polyline cannot
         carry at all. That is why the letter is a filled path.

         THE MIDDLE STROKES CROSS, AND THAT IS THE WHOLE LETTER.
         For three drafts the two V's met at a single POINT on the cap
         line, which is geometrically tidy and reads, at tab size, as
         V V: a point junction is subpixel at 16 pixels, so antialiasing
         renders it as a break and the eye is left with two letters. What
         fixes it is what old-style faces have always done. The thin
         up-stroke carries PAST the apex and the thick down-stroke begins
         before it, so the two overlap by five units and cross below the
         cap line. The middle is then a solid mass rather than a pinch, at
         every size, and no amount of antialiasing can take it apart.

         Everything else tried first and rejected: heavier stems (made it
         bold without joining it), wider serifs (made the halves look MORE
         separate), a narrower letter (helped, kept). The join was the
         problem, not the weight.

         THE GEOMETRY IS SOLVED, NOT NUDGED. The two V's are one
         construction run twice, so they cannot drift out of balance the
         way an early draft did (23 units against 20, which showed up as
         the right-hand serifs colliding). Each inner notch sits where the
         arms actually cross, and the bottom vertices are short flats
         rather than points, so the arms taper toward them the way a text
         face's do. -->
    <defs>
        <!-- Lit from the top, like every other surface on the page. -->
        <linearGradient id="w-champagne" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0d29a"/>
            <stop offset="0.55" stop-color="#dbb36a"/>
            <stop offset="1" stop-color="#c39d55"/>
        </linearGradient>
        <!-- The lacquer, lighter at the top edge where a polished panel
             catches the ceiling. Invisible as a gradient at 16 pixels, and
             the reason the tile does not read as a flat swatch at 150. -->
        <linearGradient id="w-lacquer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#17293f"/>
            <stop offset="0.6" stop-color="#0e1c2e"/>
            <stop offset="1" stop-color="#080f1b"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#w-lacquer)"/>
    <!-- Left V ends at 34.5, right V begins at 29.5: five units of overlap,
         which is the crossing. -->
    <path fill="url(#w-champagne)"
        d="M12.4 15 L20.4 15 L25.35 32.94 L30.3 15 L34.5 15 L26.9 44 L20 44 Z
           M29.5 15 L37.5 15 L42.45 32.94 L47.4 15 L51.6 15 L44 44 L37.1 44 Z"/>
    <!-- Bracket serifs on all three top terminals. The middle one caps both
         crossing strokes at once, which is the second thing holding the
         letter together. The left is widest and the right narrowest,
         because one caps a thick stem and the other a hairline. -->
    <rect x="10.9" y="12.5" width="11" height="2.5" fill="url(#w-champagne)"/>
    <rect x="28" y="12.5" width="11" height="2.5" fill="url(#w-champagne)"/>
    <rect x="45.9" y="12.5" width="7.2" height="2.5" fill="url(#w-champagne)"/>
    <!-- The underline from his flyer, where it sits under THE AUTO MAN.
         A fine rule with square ends: the rounded bar this replaces was
         the heaviest thing on the tile and read as a button. -->
    <rect x="24" y="49.5" width="16" height="2.4" fill="#dbb36a"/>
</svg>
