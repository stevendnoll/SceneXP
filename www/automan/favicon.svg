<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="John Walker, The Auto Man">
    <!-- ONE MARK, TWO SIZES. This file is the browser tab icon at 16 pixels
         and the logo on the loading screen at 150, so whatever somebody
         watches while the showroom builds is the same thing that then sits
         in their tab. It is drawn for the smaller of those two.

         IT IS NOT A CAR. The first placeholder was a little gold sedan,
         which was the wrong idea twice over: a car at 16 pixels is a gold
         smudge with two dots under it, and the one thing a car icon says
         at any size is DEALERSHIP, which is the side of the desk John
         spent twenty five years leaving.

         RE-STRUCK AT M24, IN THE INTERFACE PALETTE. It was drawn in the
         flyer's own navy and its saturated road-sign amber, on the
         argument that a badge should be louder than the interface around
         it. That argument was right about badges and wrong about this
         one: the page it sits on is now lacquer and champagne throughout,
         and the amber read as the one thing on screen that had not been
         art-directed. So it takes the same two colors everything else
         does, and the gradient down the W is the same "light has a
         direction" the cards and the arrival panel are built on.

         The flyer keeps its own amber. That is John's artwork, and it is
         a photograph of a printed thing rather than part of this
         interface. -->
    <defs>
        <!-- Lit from the top, like every other surface on the page. -->
        <linearGradient id="w-champagne" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0d29a"/>
            <stop offset="0.55" stop-color="#dbb36a"/>
            <stop offset="1" stop-color="#c39d55"/>
        </linearGradient>
        <!-- The lacquer, lighter at the top edge where a polished panel
             catches the ceiling. Invisible as a gradient at 16 pixels, and
             the reason the tile does not read as a flat swatch at 150. -->
        <linearGradient id="w-lacquer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#17293f"/>
            <stop offset="0.6" stop-color="#0e1c2e"/>
            <stop offset="1" stop-color="#080f1b"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#w-lacquer)"/>
    <!-- The bright top edge every surface in this interface carries. One
         pixel of it survives at tab size as a slightly softer top corner,
         which is all it is asked to do. -->
    <path d="M14 1.2 H50 A12.8 12.8 0 0 1 62.8 14" fill="none"
        stroke="rgba(255,255,255,0.16)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- The W as one stroked polyline rather than a filled outline: the
         round caps and joins are what keep it friendly instead of sharp,
         and 9 units of stroke is 2.25 pixels at tab size, which survives.
         The middle peak stops well short of the top so the two valleys
         stay open and it cannot close up into an M. -->
    <path d="M12.5 13 L 24 41 L 32 23.5 L 40 41 L 51.5 13" fill="none"
        stroke="url(#w-champagne)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The underline from his flyer, where it sits under THE AUTO MAN.
         Short and thick on purpose: a long hairline turns to grey at 16
         pixels, and a short bar stays a bar. -->
    <rect x="20" y="50.5" width="24" height="4.5" rx="2.25" fill="#dbb36a"/>
</svg>
