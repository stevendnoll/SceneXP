<body>
    <!-- The studio's own wordmark (assets/logo-whitestone.svg), so the
         cleaner sees the same company the customer did. -->
    <header class="tasks-header">
        <img class="tasks-logo" src="../assets/logo-whitestone.svg?v=3" alt="Whitestone Home Care" width="1068" height="239">
    </header>

    <main class="tasks-main">
        <!-- THE GATE: the PIN, until the checklist is open (main.js). -->
        <section id="tasks-gate" class="tasks-gate">
            <h1>Your cleaning checklist</h1>
            <p class="tasks-lead">A customer shared a checklist with you. Enter the
                6 digit PIN that came with the link to open it.</p>

            <!-- Hidden until main.js runs, so the form can never submit a PIN in
                 a page address without the script that handles it. -->
            <form id="pin-form" class="pin-form" hidden novalidate>
                <label for="pin-input">PIN</label>
                <input id="pin-input" name="pin" type="text" inputmode="numeric"
                    autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
                    aria-describedby="pin-status" required>
                <button id="pin-open" type="submit">Open the checklist</button>
            </form>
            <p id="pin-status" class="pin-status" role="status" aria-live="polite"></p>
        </section>

        <!-- THE CHECKLIST, once open (view.js): care preferences first, the
             home, Start here, then every room by level. -->
        <div id="tasks-view" class="tasks-view" hidden></div>

        <noscript>
            <p class="tasks-noscript">This page needs JavaScript to open a
                checklist. The checklist is locked in the link your customer
                shared, and it is only unlocked here, in your own browser,
                once you enter the PIN. Please allow JavaScript for this page
                and reload it.</p>
        </noscript>
    </main>

    <footer class="tasks-footer">
        <p>Whitestone Home Care is a SceneXP concept studio. Prices and
            bookings are examples.</p>
        <p><a href="/privacy.html">Privacy</a></p>
    </footer>
</body>
