<body>
    <h1 class="sr-only">Derby Day</h1>

    <!-- Shown when JavaScript is disabled, and read by crawlers that do not
         run it: what the scene is, and the physics it is built on (PRD, SEO:
         the explainer is the educational hook). -->
    <noscript>
        <div class="noscript-fallback">
            <h1>Derby Day</h1>
            <p>This is a wooden derby car race, and it needs JavaScript to run.
                Your car lines up at the top of a four-lane aluminum track
                against three of the neighbors' cars, and races four heats so
                every car runs in every lane. The times are averaged, and the
                fastest average wins.</p>
            <h2>What makes a derby car fast</h2>
            <p>The axles matter most. A nail straight from the kit has a burr
                under its head and crimp marks along its shaft. Filing them off,
                polishing through finer and finer sandpaper, and adding dry
                graphite can save more than a tenth of a second.</p>
            <p>Weight comes next. Air drag and the spinning wheels do not grow
                with a car's mass, so a car at the full five ounces loses less
                of its speed to them than a lighter one.</p>
            <p>Where the weight sits matters too. A car with its weight about
                three quarters of an inch in front of the rear axle keeps its
                center of mass higher up the slope for longer, so it has further
                to fall. Too far back and the front goes light, and the car
                wobbles.</p>
            <p>The shape matters least of the three a builder works hardest on,
                though a slim wedge still beats a plain block.</p>
            <p>SceneXP is a home for 3D experiences that run right in your
                browser.</p>
            <nav aria-label="Site sections">
                <ul>
                    <li><a href="/contact.html">Contact the developer</a></li>
                    <li><a href="/privacy.html">Privacy</a></li>
                </ul>
            </nav>
        </div>
    </noscript>

    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-title">DERBY DAY</div>
            <div class="loader-bar" aria-hidden="true">
                <div class="loader-progress" id="load-progress"></div>
            </div>
            <div class="loader-status" id="load-status" role="status" aria-live="polite">Loading…</div>
        </div>
    </div>

    <!-- CHECK-IN (M1): the welcome card is the registration table. Pick an
         event and a car, then Go, the one filled button. The choices are
         radio buttons (checkboxes for Time Trial), built by main.js from
         js/copy.js and the presets in js/config.js. -->
    <div id="blocker" tabindex="-1">
        <div id="instructions" class="checkin">
            <p class="title">DERBY DAY</p>
            <p class="subtitle">Race a wooden derby car down a four-lane track</p>
            <fieldset class="choice-group">
                <legend>Your race</legend>
                <div id="event-options" class="choices"></div>
            </fieldset>
            <fieldset class="choice-group">
                <legend id="car-legend">Your car</legend>
                <div id="car-options" class="choices"></div>
            </fieldset>
            <p id="checkin-note" class="checkin-note" role="alert" hidden></p>
            <button id="go-btn" class="go-btn" type="button">Go!</button>
            <p class="checkin-more">
                <a id="explore-link" class="checkin-explore" href="/">More 3D worlds to explore at SceneXP.com</a>
            </p>
        </div>
    </div>

    <canvas id="game-canvas" role="img" aria-label="A four-lane aluminum derby track running down the length of a community hall, with wooden derby cars at the starting gate"></canvas>

    <!-- Back to check-in, exactly as Escape does: a back arrow, since that
         is what it does. Hidden until a race is on: .ui-float is
         display:none until main.js adds .visible. -->
    <button id="help-btn" class="ui-float menu-btn help-btn" type="button" title="Back to check-in (Esc)" aria-label="Back to check-in">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 6.5L9 12l5.5 5.5" stroke-linejoin="round" />
        </svg>
    </button>

    <!-- The track's timer (js/board.js), for the eye only: a screen reader
         hears each heat through #race-status. -->
    <div id="timer" class="timer" aria-hidden="true"></div>

    <!-- The announcer, as a caption (js/copy.js). For the eye: the same
         heat results reach a screen reader through #race-status. -->
    <p id="caption" class="caption" aria-hidden="true"></p>
    <p id="race-status" class="sr-only" role="status" aria-live="polite"></p>

    <!-- Over the visitor's car while it races. -->
    <span id="you-tag" class="you-tag" aria-hidden="true">You</span>

    <button id="skip-btn" class="ui-float skip-btn" type="button">Skip to results</button>

    <!-- THE RESULTS (js/board.js): a real table, the lane row, and why the
         visitor's car ran as it did. Race again takes focus last on purpose:
         the title takes it first, so a screen reader hears what this is. -->
    <div id="results-modal" class="results-modal hidden" role="dialog" aria-modal="true" aria-labelledby="results-title">
        <div class="results-card">
            <p id="results-event" class="results-event"></p>
            <h2 id="results-title" class="results-title" tabindex="-1">Results</h2>
            <table id="results-table" class="results-table"></table>
            <h3 class="results-sub">Each lane’s average</h3>
            <ul id="results-lanes" class="results-lanes"></ul>
            <h3 id="results-why-heading" class="results-sub">Why your car ran as it did</h3>
            <ul id="results-why" class="results-why"></ul>
            <div class="results-actions">
                <button id="results-again" class="go-btn" type="button">Race again</button>
                <button id="results-another" class="results-another" type="button">Choose another race</button>
            </div>
            <p id="results-status" class="sr-only" role="status" aria-live="polite"></p>
            <p class="results-mark" aria-hidden="true">Derby Day &middot; SceneXP.com</p>
        </div>
    </div>

    <script type="module" src="../lib/three/r186/three.min.js"></script>
    <script type="module" src="js/main.min.js"></script>
</body>
