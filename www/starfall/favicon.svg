<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Starfall">
    <!-- A two-armed spiral galaxy: a warm core and two cool arms of stars,
         on the scene's deep-space background. -->
    <rect width="64" height="64" rx="14" fill="#02030a"/>
    <circle cx="32" cy="32" r="11" fill="#ffd59a" opacity="0.18"/>
    <g fill="none" stroke-linecap="round">
        <path d="M32 32 C38 26 47 28 49 36 C51 45 42 53 31 52" stroke="#9fc4ff" stroke-width="3.2" opacity="0.85"/>
        <path d="M32 32 C26 38 17 36 15 28 C13 19 22 11 33 12" stroke="#9fc4ff" stroke-width="3.2" opacity="0.85"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="#ffe3b8"/>
    <circle cx="44" cy="47" r="1.3" fill="#ff8fb8"/>
    <circle cx="19" cy="17" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="52" cy="14" r="1" fill="#cfd8ff" opacity="0.8"/>
    <circle cx="11" cy="51" r="0.9" fill="#cfd8ff" opacity="0.7"/>
</svg>
