<!-- A REAL FRACTAL, DRAWN SO ITS TIPS ARE THE FOLIAGE.

     The previous icon was a solid canopy over a trunk, and the reason its
     comment gave was correct: at 16 pixels a bare branching skeleton is twigs a
     third of a pixel wide, and it turns to grey mush in a browser tab. That
     still holds, so this does not draw a skeleton either.

     It draws SIX LEVELS of one recursive rule, with the strokes tapering to a
     floor rather than to nothing. A tip is about 0.6 of a pixel at tab size,
     which is invisible on its own, and there are sixty-four of them packed into
     the crown, so together they resolve into a solid mass. The silhouette at 16
     pixels is therefore the same canopy over a trunk it always was, and at any
     size big enough to show structure it is an actual fractal tree, which is
     the claim the scene itself makes.

     Generated from the rule and then fitted to the frame, so the branching is
     real rather than drawn to look real. Grouped one path per depth, which is
     seven elements for a hundred and twenty-seven segments. -->
