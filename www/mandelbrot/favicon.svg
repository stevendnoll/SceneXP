<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Mandelbrot Set">
    <!-- The Mandelbrot set in silhouette: the main cardioid and its
         period-two bulb, black inside, burning neon orange at the edge,
         floating in a softly lit starfield. -->
    <rect width="64" height="64" rx="14" fill="#0b0e20"/>
    <!-- A few stars so the space is never fully dark -->
    <circle cx="12" cy="12" r="1.3" fill="#cfd8ff" opacity="0.9"/>
    <circle cx="52" cy="10" r="1" fill="#ffe3c2" opacity="0.8"/>
    <circle cx="55" cy="42" r="1.2" fill="#cfd8ff" opacity="0.85"/>
    <circle cx="10" cy="50" r="0.9" fill="#bfd2ff" opacity="0.7"/>
    <circle cx="30" cy="7" r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="47" cy="56" r="0.9" fill="#ffffff" opacity="0.6"/>
    <!-- Soft outer glow pass -->
    <g stroke="#ff7a1a" fill="#000000" stroke-linejoin="round" opacity="0.45" stroke-width="6">
        <path d="M51 32 C51 25 46 20 39 20 C33 20 28 25 28 32 C28 39 33 44 39 44 C46 44 51 39 51 32 Z"/>
        <circle cx="21" cy="32" r="7"/>
        <circle cx="12" cy="32" r="2.6"/>
    </g>
    <!-- Crisp neon edge pass -->
    <g stroke="#ff7a1a" fill="#000000" stroke-linejoin="round" stroke-width="2.4">
        <path d="M51 32 C51 25 46 20 39 20 C33 20 28 25 28 32 C28 39 33 44 39 44 C46 44 51 39 51 32 Z"/>
        <circle cx="21" cy="32" r="7"/>
        <circle cx="12" cy="32" r="2.6"/>
    </g>
</svg>
