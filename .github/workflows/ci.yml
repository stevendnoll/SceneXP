name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the Jest suite with coverage
        run: npm run test:coverage

      - name: Rebuild minified assets
        run: npm run build

      - name: Minified assets are up to date
        run: |
          if ! git diff --exit-code; then
            echo "Minified assets are out of date. Please run 'npm run build' and commit the results."
            exit 1
          fi
